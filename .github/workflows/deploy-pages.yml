name: Refresh and publish AI Brief

on:
  push:
    branches: [master]
    paths:
      - 'ai_news/**'
      - 'ai_news_tests/**'
      - 'data/news.json'
      - 'gne/**'
      - 'pyproject.toml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3,7,11,15,19,23 * * *'
      timezone: 'Europe/Dublin'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install extractor
        run: python -m pip install -e .
      - name: Test news reader and static export
        run: python -m unittest discover -s ai_news_tests -v
      - name: Refresh publisher feeds and build site
        run: python -m ai_news.build_site --refresh
      - name: Preserve news for the next refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update AI Brief news snapshot [skip ci]'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
